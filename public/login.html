<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-boutique</title>
<style>body{font-family:system-ui;margin:8vh auto;max-width:400px;background:#f3f6fa;color:#12213a}main{background:white;padding:28px;border-radius:12px;box-shadow:0 10px 35px #17335818}input,button{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;border-radius:6px}input{border:1px solid #cad3e0}button{background:#1d5ca8;color:#fff;border:0;cursor:pointer}</style></head>
<body><main><h1>Mini-boutique</h1><form id="login"><label>Email<input name="email" type="email" required value="demo@boutique.test"></label><label>Mot de passe<input name="password" type="password" required value="demo123"></label><button>Se connecter</button></form><p id="resultat" role="status"></p></main>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.querySelector('#resultat').textContent=(await res.json()).message||'Connexion refusee';});</script></body></html>
